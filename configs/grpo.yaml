# Approved GRPO settings (TRAINING_PROPOSAL.md, pre-registered in commit 0bc1d5e).
# Change values only through `--set key=value` on the command line, so every
# deviation is recorded in run_config.json next to the checkpoints.

model: Qwen/Qwen2.5-0.5B-Instruct
# fp16_base: frozen fp16 weights + fp32 LoRA + fp16 autocast (T4 default)
# fp32_base_amp: fp32 weights + fp16 autocast (fallback if fp16_base gives NaN/inf)
# fp32: no mixed precision (CPU tests only)
precision: fp16_base
train_file: data/train.jsonl

lora:
  r: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

# reward_task, reward_resist, reward_refusal, monitor (weight 0: logging only)
reward_weights: [1.0, 1.0, 1.0, 0.0]

grpo:
  learning_rate: 5.0e-5
  lr_scheduler_type: linear
  warmup_steps: 10
  beta: 0.04
  num_generations: 8
  per_device_train_batch_size: 16   # completions per micro-batch
  gradient_accumulation_steps: 4    # 16 x 4 = 64 completions = 8 prompts x 8 per step
  max_steps: 300
  temperature: 0.9
  max_completion_length: 96
  loss_type: dapo
  scale_rewards: group
  num_iterations: 1
  disable_dropout: true
  mask_truncated_completions: false
  gradient_checkpointing: true
  max_grad_norm: 1.0
  logging_steps: 1
  save_steps: 25
  save_total_limit: 2
  seed: 1

milestone_every: 100   # adapter-only copies kept for the step-100/200/300 curve
sample_every: 25       # write a few sample completions to samples.jsonl
